# pos-web: static host for the till UI.
#
# Port 8080 because Cloud Run injects PORT=8080 and health-checks it. The
# try_files fallback to /index.html is what makes a client-side route survive
# a page refresh — without it, reloading on any path but / returns 404.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # PROPOSAL 08 §2 — this host served NO security headers at all until now,
  # while ims-web and ims-backend both returned a full set. That left the one
  # screen where a cashier takes money framable by any origin and with no
  # restriction on where scripts could come from. The omission was inherited
  # from the hand-made July config this file replaced, not introduced.
  #
  # `always` on every one of them: without it nginx adds the header only to
  # 2xx/3xx, so error pages — the ones most worth not framing — would go out
  # bare.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # THE CONNECT-SRC HOST IS NOT OPTIONAL AND CANNOT BE COPIED FROM ims-web.
  #
  # ims-web sets `connect-src 'self'` because it is served from the same
  # origin as the API it calls. This bundle is not: its API base is baked in
  # at build time by VITE_API_BASE and points at the pos-terminal service, so
  # every call the till makes is cross-origin. A copied `'self'` policy would
  # block all of them, and the failure appears only at the counter.
  #
  # This origin MUST match the VITE_API_BASE the bundle was built with — see
  # the build command in Dockerfile. If they ever diverge the till loads,
  # renders, and can do nothing, which is why §7 of the proposal requires
  # ringing up a sale after deploying rather than only checking the headers.
  #
  # default-src 'none' with each directive named, rather than 'self' with
  # exceptions: the bundle was checked and has no inline styles, no external
  # fonts, no <img>, and no remote assets of any kind. lucide-react renders
  # SVG as components, so nothing is fetched for icons.
  #
  # data: on img-src is for the offline-queue export, which builds its file in
  # the browser. 'unsafe-inline' appears nowhere, for scripts or styles.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://pos-terminal-902186518684.asia-south2.run.app; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

  location / { try_files $uri $uri/ /index.html; }
}
