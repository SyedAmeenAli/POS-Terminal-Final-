# Install into /etc/newsyslog.d/pos-terminal.conf on macOS.
#
# Replace REPLACE_WITH_SHOP_USER with the account the till runs as. These paths
# must match StandardOutPath/StandardErrorPath in the launchd plists, or logs
# rotate nothing and grow unbounded.
#
# logfilename                                                          owner:group  mode count size when flags
/Users/REPLACE_WITH_SHOP_USER/Library/Logs/pos-terminal/backend.log         640  7  10240  *  J
/Users/REPLACE_WITH_SHOP_USER/Library/Logs/pos-terminal/cloud-sql-proxy.log 640  7  10240  *  J
